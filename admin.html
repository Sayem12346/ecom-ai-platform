<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopAI Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #E8E8E8; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    .login-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-box { background: #111; border: 1px solid #1E1E1E; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; }
    .login-title { font-size: 22px; font-weight: 800; color: #00FF94; margin-bottom: 8px; }
    .login-sub { font-size: 13px; color: #555; margin-bottom: 24px; }

    input { background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 10px; padding: 14px 16px; color: #E8E8E8; font-size: 15px; outline: none; width: 100%; margin-bottom: 12px; }
    input:focus { border-color: #00FF9460; }
    input::placeholder { color: #444; }

    button { background: #00FF94; color: #0A0A0A; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; width: 100%; }

    .dashboard { display: none; padding: 24px; }
    .dash-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .dash-logo { font-size: 20px; font-weight: 800; color: #00FF94; }
    .logout-btn { background: transparent; border: 1px solid #2A2A2A; color: #666; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; width: auto; }

    .stat-box { background: #111; border: 1px solid #1E1E1E; border-radius: 12px; padding: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
    .stat-icon { font-size: 28px; }
    .stat-number { font-size: 28px; font-weight: 800; color: #00FF94; }
    .stat-label { font-size: 13px; color: #555; }

    .section-title { font-size: 15px; font-weight: 700; color: #E8E8E8; margin-bottom: 12px; }

    .user-card { background: #111; border: 1px solid #1E1E1E; border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .user-name { font-size: 14px; font-weight: 600; color: #E8E8E8; }
    .user-phone { font-size: 13px; color: #555; }
    .user-date { font-size: 11px; color: #333; }

    .loading { text-align: center; color: #444; padding: 32px; font-size: 14px; }
    .error-msg { background: #FF000015; border: 1px solid #FF000040; border-radius: 10px; padding: 12px; color: #FF6B6B; font-size: 13px; margin-top: 12px; display: none; text-align: center; }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div class="login-page" id="loginPage">
    <div class="login-box">
      <div class="login-title">🔐 Admin Login</div>
      <div class="login-sub">শুধু তুমি access করতে পারবে</div>
      <input type="password" id="passInput" placeholder="Password দাও" onkeydown="if(event.key==='Enter') handleLogin()">
      <button onclick="handleLogin()">Login করো</button>
      <div class="error-msg" id="loginError">❌ Password ভুল!</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="dash-nav">
      <div class="dash-logo">ShopAI Admin</div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <div class="stat-box">
      <div class="stat-icon">👥</div>
      <div>
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">মোট Signup</div>
      </div>
    </div>

    <div class="section-title">📋 Signup List</div>
    <div id="userList"><div class="loading">লোড হচ্ছে...</div></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dhjzljxlpuryuhtxyxfh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoanpsanhscHVyeXVodHh5eGZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTIwMTYsImV4cCI6MjA5NTEyODAxNn0.PqIB7zGOrNwS1anfR19ejivGU_21RmGhnUfwG_X8bek';
    const ADMIN_PASS = 'shopai2026';

    function handleLogin() {
      const pass = document.getElementById('passInput').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function handleLogout() {
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('passInput').value = '';
    }

    async function loadData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/Signups?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        const data = await res.json();
        document.getElementById('totalCount').textContent = data.length;

        const list = document.getElementById('userList');
        if (data.length === 0) {
          list.innerHTML = '<div class="loading">এখনো কেউ signup করেনি</div>';
          return;
        }

        list.innerHTML = data.map(u => `
          <div class="user-card">
            <div>
              <div class="user-name">${u.name}</div>
              <div class="user-phone">📞 ${u.phone}</div>
            </div>
            <div class="user-date">${new Date(u.created_at).toLocaleDateString('bn-BD')}</div>
          </div>
        `).join('');
      } catch {
        document.getElementById('userList').innerHTML = '<div class="loading">❌ Data load হয়নি</div>';
      }
    }
  </script>

</body>
</html>
